name: News contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write  # the validate job commits rebuilt indexes on main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_*.py"

      # An approval copies one item from pending to main; the indexes are derived from the
      # items and would be stale until rebuilt. Rebuild here - committed on main, left in
      # the runner's tree on a pull request - and only then check.
      - name: Rebuild the derived indexes
        run: python scripts/build_news.py

      - name: Commit the rebuilt indexes (main only)
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- news; then
            echo "indexes already current"
            exit 0
          fi
          git config user.name "diffusion-love-news"
          git config user.email "noreply@diffusion.love"
          git add -- news
          git commit -qm "indexes: rebuild after approval"
          # This push starts one more run; that run finds no drift and commits nothing.
          git push origin HEAD:main

      - run: python scripts/build_news.py --check

  purge-jsdelivr:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect changed public JSON
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
              ':(glob)news/*.json' ':(glob)news/items/*.json' \
              > "$RUNNER_TEMP/changed-news-files.txt"
          else
            echo "Previous push commit is unavailable; purging every public news JSON."
            git ls-files \
              ':(glob)news/*.json' ':(glob)news/items/*.json' \
              > "$RUNNER_TEMP/changed-news-files.txt"
          fi
      - name: Purge changed feed files from jsDelivr
        run: >-
          python scripts/purge_jsdelivr.py
          --paths-file "$RUNNER_TEMP/changed-news-files.txt"
